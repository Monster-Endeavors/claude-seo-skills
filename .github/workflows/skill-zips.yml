name: Skill zips

# Every skill in skills/ has a matching zip in dist/ for one-click install.
# Pull requests fail if a skill's frontmatter isn't valid YAML or a zip doesn't
# match its folder. Pushes to main rebuild the zips and commit any that
# changed, so they never go stale.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "dist/**"
      - "scripts/build_zips.py"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Check the frontmatter and that the zips match the skill folders
        run: python scripts/build_zips.py --check

  rebuild:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Rebuild the zips
        run: python scripts/build_zips.py
      - name: Commit any zips that changed
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "Zips are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild skill zips"
          git push
